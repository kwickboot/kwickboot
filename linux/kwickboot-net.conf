# KwickBoot server: large file transfers on the LAN (images over HTTP/TCP, multicast over UDP, TFTP).
# SPDX-License-Identifier: AGPL-3.0-or-later
# Installed as /etc/sysctl.d/90-kwickboot-net.conf (install.sh, the server image). Delete the file to go back to
# Debian's defaults. Values are maximums: the kernel only grows a buffer when a fast connection needs it.

# socket buffers: up to 16 MB per socket - plenty for a LAN even at 10 Gbit/s (bigger only helps long-distance links)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 65536

# TCP: auto-tuned windows up to 16 MB, BBR congestion control with fair-queue pacing (steady at full speed, gentle on
# switches), no slow restart after a pause (agents fetch in bursts), path-MTU probing
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_notsent_lowat = 131072

# UDP (multicast, TFTP): bigger minimums, and a longer receive backlog so bursts at line rate are not dropped
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 16384
net.core.netdev_budget = 600

# many PCs at once: more pending connections
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
