<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KwickBoot — this machine</title>
<!--
  KwickBoot machine-scoped local page (RICH UI tier). Served by the KwickBoot server, scoped to the requesting
  machine by ?mac= or its source IP. Rendered on capable machines by the cog/WPE kiosk (kb-desktop); also opens
  in any browser for testing. MAINSTREAM WEB STANDARDS ONLY (no framework, no engine-specific APIs) so the
  rendering engine stays swappable. Reuses the department-policy-enforced /agent/* endpoints.
-->
<style>
  :root{
    --bg:#13162a; --bg2:#171a30; --card:#1c2038; --card2:#222742; --line:#2e3657;
    --ink:#f0e4de; --mut:#ac9084; --val:#f0e4de; --wht:#ffffff;
    --acc:#d97757; --grn:#78c84a; --brand:#c32b27; --danger:#c32b27;
    --radius:14px; --gap:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #1b2140 0%, transparent 60%), var(--bg);
    background-color:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:max(18px,env(safe-area-inset-top)) 18px 40px;
  }
  .wrap{max-width:1200px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
  .logo{width:52px;height:52px;border-radius:13px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 20px rgba(195,43,39,.35)}
  .logo svg{width:28px;height:28px;fill:#fff}
  .brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--mut);font-size:13px}
  .status{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:14px;color:var(--mut)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn)}
  .chip{color:var(--grn);font-weight:700;letter-spacing:.4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 120%);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .card h2{margin:0 0 14px;font-size:16px;font-weight:700}
  .rows{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14.5px}
  .rows .k{color:var(--mut)} .rows .v{color:var(--val)} .v.good{color:var(--grn)}
  .advice p{margin:4px 0;color:var(--mut);font-size:14px}
  .statusbar{margin:var(--gap) 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
  .statusbar .big{font-size:15px} .statusbar .sub{color:var(--mut);font-size:13.5px;margin-top:4px}
  .prog{margin-top:12px;height:8px;background:var(--card2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .prog .fill{height:100%;background:var(--acc);width:0;transition:width .5s ease}
  .prog .fill.ok{background:var(--grn)} .prog .fill.bad{background:var(--danger)}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin-top:var(--gap)}
  @media(max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.tiles{grid-template-columns:1fr}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--acc);outline:none}
  .tile.primary{background:linear-gradient(180deg,var(--brand),#9e211d);border-color:#e0564f}
  .tile .t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
  .tile .d{color:var(--mut);font-size:13px;margin-top:6px}
  .tile.primary .d{color:#f6d9d4}
  footer{margin-top:28px;display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(6,8,16,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .scrim.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px}
  .modal h3{margin:0 0 4px;font-size:19px}
  .modal .rule{height:2px;background:var(--acc);border-radius:2px;margin:12px 0 16px;width:120px}
  .modal p.lead{color:var(--mut);margin:0 0 16px}
  .field{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin:10px 0}
  .field label{color:var(--val)}
  .field input{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--wht);padding:11px 12px;font:inherit;width:100%}
  .field input:focus{outline:none;border-color:var(--acc)}
  .list{display:grid;gap:8px;margin:4px 0 2px}
  .opt{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
  .opt:hover{border-color:var(--acc)} .opt[aria-selected=true]{border-color:var(--acc);background:#2a2f4e}
  .opt .sub{color:var(--mut);font-size:12.5px}
  .langgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:620px){.langgrid{grid-template-columns:repeat(2,1fr)}}
  .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  button.b{border:1px solid var(--line);background:var(--card2);color:var(--val);border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
  button.b:hover{border-color:var(--acc)}
  button.b.acc{background:var(--acc);border-color:var(--acc);color:#fff}
  button.b.danger{background:var(--danger);border-color:#e0564f;color:#fff}
  .warn{background:#2a1d1c;border:1px solid #5a2e2a;border-radius:10px;padding:12px 14px;color:#f3c7c1;margin:10px 0}
  .muted{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 13h6l-1 9 9-11h-6z"/></svg></div>
    <div class="brand"><h1>KwickBoot</h1><p data-i18n="subtitle">the RAM OS with AI built in</p></div>
    <div class="status"><span class="dot" id="dot"></span><span class="chip" id="chip">READY</span><span id="chipsub" class="muted">managed</span></div>
  </header>

  <div class="grid">
    <section class="card">
      <h2 data-i18n="thisMachine">This machine</h2>
      <div class="rows" id="facts"><div class="k" data-i18n="loading">Loading…</div><div class="v"></div></div>
    </section>
    <div style="display:grid;gap:var(--gap)">
      <section class="card">
        <h2 data-i18n="network">Network</h2>
        <div class="rows" id="net"><div class="k" data-i18n="address">Address</div><div class="v" id="net_addr">—</div><div class="k" data-i18n="name">Name</div><div class="v" id="m_name">—</div></div>
      </section>
      <section class="card advice">
        <h2 data-i18n="adviceTitle">AI install advice</h2>
        <div id="advice"><p data-i18n="checking">Checking this machine…</p></div>
      </section>
    </div>
  </div>

  <div class="statusbar"><div class="big" id="status" data-i18n="idle">Idle — no job running.</div><div class="sub" id="status2" data-i18n="idleSub">Pick an OS below, or let IT start it from the web console.</div><div class="prog" id="prog" style="display:none"><div class="fill" id="progfill"></div></div></div>

  <div class="tiles">
    <button class="tile primary" id="t_install"><div class="t" data-i18n="installTile">Install an OS</div><div class="d" data-i18n="installTileD">Inspect, pick, deploy — right here</div></button>
    <button class="tile" id="t_details"><div class="t" data-i18n="detailsTile">Hardware details</div><div class="d" data-i18n="detailsTileD">Full inventory &amp; health</div></button>
    <button class="tile" id="t_rescue"><div class="t"><span data-i18n="rescueTile">Rescue</span> 🛟</div><div class="d" data-i18n="rescueTileD">Repair, recover, wipe</div></button>
    <button class="tile" id="t_lang"><div class="t" data-i18n="langTile">Language</div><div class="d">Aa · العربية · Рус — 20 languages</div></button>
    <button class="tile" id="t_connect"><div class="t" data-i18n="connectTile">Let IT connect</div><div class="d" data-i18n="connectTileD">Share an SSH code with your admin</div></button>
  </div>

  <footer><span data-i18n="footer">KwickBoot — any PC, no touch</span><span>www.kwickboot.com</span></footer>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script src="i18n.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const qmac = new URLSearchParams(location.search).get("mac") || "";
const api = p => p + (p.includes("?")?"&":"?") + "mac=" + encodeURIComponent(STATE.mac||qmac);
const STATE = { mac:qmac, info:{}, os:[], tools:[], lang:"en_US.UTF-8", langName:"English", keymap:"us", ui:"en" };

// ---- i18n: translate the console UI itself (shared strings from i18n.js; English is the fallback) ----
const I18N = window.KB_I18N || { en:{} };
function t(key){ const l=I18N[STATE.ui]||I18N.en||{}; return (key in l) ? l[key] : ((I18N.en&&I18N.en[key]) ?? key); }
function renderChip(){ const ap=STATE.info.approved; $("#chip").textContent=ap?t("ready"):t("pending"); $("#chipsub").textContent=ap?t("managed"):t("awaiting"); }
function applyLang(code){
  STATE.ui = I18N[code] ? code : "en";
  const d = I18N[STATE.ui] || I18N.en || {};
  const h = document.documentElement; h.lang = STATE.ui; h.dir = d.dir || "ltr";
  document.querySelectorAll("[data-i18n]").forEach(e=>{ const v=t(e.getAttribute("data-i18n")); if(v!=null) e.textContent=v; });
  if (STATE.info && Object.keys(STATE.info).length) render(STATE.info); else renderChip();   // re-translate the dynamic bits
}

// 20 common language options (same spirit as kbgui); value = locale|keymap
const LANGS = [
 ["English","en_US.UTF-8","us"],["Español","es_ES.UTF-8","es"],["Français","fr_FR.UTF-8","fr"],["Deutsch","de_DE.UTF-8","de"],
 ["Português","pt_BR.UTF-8","br"],["Italiano","it_IT.UTF-8","it"],["Nederlands","nl_NL.UTF-8","nl"],["Polski","pl_PL.UTF-8","pl"],
 ["Русский","ru_RU.UTF-8","ru"],["Українська","uk_UA.UTF-8","ua"],["Türkçe","tr_TR.UTF-8","tr"],["العربية","ar_SA.UTF-8","ara"],
 ["中文","zh_CN.UTF-8","cn"],["日本語","ja_JP.UTF-8","jp"],["한국어","ko_KR.UTF-8","kr"],["हिन्दी","hi_IN.UTF-8","in"],
 ["Tiếng Việt","vi_VN.UTF-8","vn"],["ไทย","th_TH.UTF-8","th"],["Čeština","cs_CZ.UTF-8","cz"],["Svenska","sv_SE.UTF-8","se"],
];

async function jget(url){ const r = await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r; }
async function loadFacts(){
  try{
    const d = await (await jget("/local/facts" + (qmac?("?mac="+encodeURIComponent(qmac)):""))).json();
    STATE.mac = d.mac || STATE.mac; STATE.info = d; render(d);
  }catch(e){ $("#facts").innerHTML=""; $("#facts").append(row(t("status"),t("noServer"))); }
}
function row(k,v,good){ const f=document.createDocumentFragment(); f.append(el("div","k",k)); const vv=el("div","v"+(good?" good":""),v||"—"); f.append(vv); return f; }
function render(d){
  const f=$("#facts"); f.innerHTML="";
  f.append(row(t("model"), d.model||"—"));
  f.append(row(t("serial"), d.serial||"—"));
  f.append(row(t("cpu"), d.cpu||"—"));
  f.append(row(t("memory"), d.ram||"—"));
  f.append(row(t("firmware"), d.firmware||"—", /secure boot on/i.test(d.firmware||"")));
  f.append(row(t("tpm"), d.tpm||"—"));
  f.append(row(t("disks"), (d.disks&&d.disks.length)? d.disks.join("  ·  ") : t("scanning")));
  $("#net_addr").textContent = d.net_addr || "—"; $("#net_addr").className = "v"+(d.net_addr?" good":"");
  $("#m_name").textContent = (d.name||"—") + (d.department?("  ·  "+d.department):"");
  renderChip();
  // live install/rescue/wipe progress - mirrors a job started HERE or by IT from the web console (shared job log)
  const j = d.job;
  if (j) {
    const running = (j.state==="running");
    const verb = j.type==="rescue"? t("rescuing") : j.type==="wipe"? t("wiping") : t("installing");
    const osName = j.os ? (" "+j.os.charAt(0).toUpperCase()+j.os.slice(1)) : "";
    const pct = Math.max(3, Math.min(100, Math.round((j.step/(j.total||8))*100)));
    $("#status").textContent = running ? (verb+osName) : ((j.state==="failed"? t("failed") : t("done"))+osName);
    const stepTxt = running ? (t("stepWord")+" "+j.step+" / "+(j.total||8)+(j.label? (" · "+j.label) : "")) : "";
    $("#status2").textContent = [stepTxt, j.line].filter(Boolean).join("  —  ");
    $("#prog").style.display = "block";
    const fill=$("#progfill"); fill.style.width = (running? pct : 100)+"%";
    fill.className = "fill" + (j.state==="failed"? " bad" : (running? "" : " ok"));
  } else {
    $("#prog").style.display = "none";
    if(d.status){ $("#status").textContent = d.status; } if(d.status2){ $("#status2").textContent=d.status2; }
  }
  const adv=$("#advice"); adv.innerHTML="";
  (d.advice||[t("idleSub")]).forEach(a=>adv.append(el("p",null,a)));
}

// ---- modal plumbing ----
function closeModal(){ $("#scrim").classList.remove("on"); $("#modal").innerHTML=""; }
$("#scrim").addEventListener("click",e=>{ if(e.target===$("#scrim")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
function openModal(build){ const m=$("#modal"); m.innerHTML=""; build(m); $("#scrim").classList.add("on"); const inp=m.querySelector("input,button.acc,button.danger"); if(inp) inp.focus(); }
function head(m,title,lead){ m.append(el("h3",null,title)); m.append(el("div","rule")); if(lead){ const p=el("p","lead",lead); m.append(p);} }
function btnRow(m,...btns){ const r=el("div","btns"); btns.forEach(b=>r.append(b)); m.append(r); return r; }
function mkbtn(label,cls,fn){ const b=el("button","b "+(cls||""),label); b.addEventListener("click",fn); return b; }

// ---- sign-in gate (install / rescue) ----
function signIn(then){
  openModal(m=>{
    head(m, then==="rescue"?t("signInRescue"):t("signInInstall"), t("creds"));
    const u=el("input"); u.placeholder=t("username"); u.autocapitalize="off"; u.autocomplete="username";
    const p=el("input"); p.type="password"; p.placeholder=t("password"); p.autocomplete="current-password";
    const fu=el("div","field"); fu.append(el("label",null,t("username")),u);
    const fp=el("div","field"); fp.append(el("label",null,t("password")),p);
    m.append(fu,fp);
    const go=()=>{ STATE.user=u.value; STATE.pass=p.value; then==="rescue"?rescuePick():osPick(); };
    p.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    btnRow(m, mkbtn(t("cancel"),"",closeModal), mkbtn(t("signIn"),"acc",go));
  });
}

// ---- OS picker -> disk -> confirm -> install ----
async function osPick(){
  try{ STATE.os = (await (await jget(api("/agent/oslist"))).text()).trim().split("\n").filter(Boolean).map(l=>{const [id,name,gb]=l.split("|");return{id,name,gb};}); }
  catch(e){ STATE.os=[]; }
  let sel = STATE.os[0]?.id;
  openModal(m=>{
    head(m,t("chooseOS"), STATE.os.length?null:"No OS catalog available for this machine yet.");
    const list=el("div","list");
    STATE.os.forEach(o=>{ const o2=el("div","opt"); o2.setAttribute("role","option"); o2.setAttribute("aria-selected", o.id===sel);
      o2.append(el("div",null,o.name)); if(+o.gb>0) o2.append(el("div","sub","≥ "+o.gb+" GB"));
      o2.addEventListener("click",()=>{ sel=o.id; [...list.children].forEach(c=>c.setAttribute("aria-selected", c===o2)); });
      list.append(o2); });
    m.append(list);
    btnRow(m, mkbtn(t("cancel"),"",closeModal), mkbtn(t("install"),"acc",()=>{ if(sel) diskPick(sel); }));
  });
}
async function diskPick(osid){
  let disks=STATE.info.disklist||[];
  if(disks.length>=2){
    let sel=disks[0].dev;
    openModal(m=>{
      head(m,t("chooseDisk"));
      const list=el("div","list");
      disks.forEach(d=>{ const o=el("div","opt"); o.setAttribute("aria-selected", d.dev===sel);
        o.append(el("div",null,d.dev+"   "+d.size+"   "+d.type+"   "+(d.model||"")));
        o.addEventListener("click",()=>{ sel=d.dev; [...list.children].forEach(c=>c.setAttribute("aria-selected",c===o)); });
        list.append(o); });
      m.append(list);
      btnRow(m, mkbtn(t("cancel"),"",closeModal), mkbtn(t("next"),"acc",()=>confirmInstall(osid,sel)));
    });
  } else confirmInstall(osid, disks[0]?.dev||"");
}
function osName(id){ return (STATE.os.find(o=>o.id===id)||{}).name||id; }
function confirmInstall(osid,disk){
  openModal(m=>{
    head(m,t("eraseTitle"));
    m.append(el("div","warn","This ERASES everything on "+(disk||"the primary disk")+" and installs "+osName(osid)+". All data and any OS on that disk are lost — this cannot be undone."));
    const b=btnRow(m, mkbtn(t("cancel"),"",()=>osPick()), mkbtn(t("eraseBtn"),"danger",async()=>{
      const r=await postCred("/agent/install", {os:osid, disk, user:STATE.user, pass:STATE.pass, locale:STATE.lang, keymap:STATE.keymap});
      info("Install", r.startsWith("ok")? ("Installing "+osName(osid)+(disk?(" on "+disk):"")+" — watch here and in the web console.") : clean(r));
    }));
  });
}

// ---- rescue ----
async function rescuePick(){
  try{ STATE.tools=(await (await jget("/agent/toollist")).text()).trim().split("\n").filter(Boolean).map(l=>{const[name,title]=l.split("|");return{name,title};}); }catch(e){ STATE.tools=[]; }
  if(!STATE.tools.length){ info("Rescue unavailable","No rescue tool is published on the server yet."); return; }
  const t=STATE.tools[0];
  openModal(m=>{
    head(m,"Start "+t.title+"?");
    m.append(el("div","warn","This machine will REBOOT into "+t.title+" now. Unsaved work in this session is lost; disks are untouched until you choose an action inside the tool."));
    btnRow(m, mkbtn("Cancel","",closeModal), mkbtn("Reboot into Rescue","acc",async()=>{
      const r=await postCred("/agent/rescue",{tool:t.name,user:STATE.user,pass:STATE.pass});
      info("Rescue", r.startsWith("ok")? "If IT authorises it, the machine reboots into "+t.title+" now." : clean(r));
    }));
  });
}

// ---- language ----
function langPick(){
  let sel=LANGS.findIndex(L=>L[1]===STATE.lang); if(sel<0) sel=0;
  openModal(m=>{
    head(m,t("chooseLang"));
    const g=el("div","langgrid");
    LANGS.forEach((L,i)=>{ const o=el("div","opt"); o.setAttribute("aria-selected", i===sel); o.style.justifyContent="center";
      o.append(el("div",null,L[0])); o.addEventListener("click",()=>{ sel=i; [...g.children].forEach(c=>c.setAttribute("aria-selected",c===o)); });
      g.append(o); });
    m.append(g);
    btnRow(m, mkbtn(t("cancel"),"",closeModal), mkbtn(t("apply"),"acc",()=>{
      STATE.langName=LANGS[sel][0]; STATE.lang=LANGS[sel][1]; STATE.keymap=LANGS[sel][2];
      applyLang(LANGS[sel][1].split("_")[0]);   // re-render the whole console in the chosen language (also used as the install locale)
      closeModal();
    }));
  });
}

function details(){
  const d=STATE.info;
  openModal(m=>{
    head(m,t("detailsTile"));
    const r=el("div","rows");
    [[t("model"),d.model],[t("serial"),d.serial],[t("cpu"),d.cpu],[t("memory"),d.ram],[t("firmware"),d.firmware],[t("tpm"),d.tpm],[t("network"),d.net_addr],["Health",d.health||"ok"]].forEach(([k,v])=>{ r.append(el("div","k",k)); r.append(el("div","v",v||"—")); });
    m.append(r);
    if(d.disks&&d.disks.length){ m.append(el("p","lead",t("disks"))); const dl=el("div","list"); d.disks.forEach(x=>dl.append(el("div","opt",x))); m.append(dl); }
    btnRow(m, mkbtn(t("cancel"),"acc",closeModal));
  });
}
function connect(){ info("Let IT connect","Ask your admin to open this machine in the web console — they can start a remote session from there."); }
function info(title,msg){ openModal(m=>{ head(m,title); m.append(el("p","lead",msg)); btnRow(m, mkbtn("Close","acc",closeModal)); }); setTimeout(loadFacts, 800); }
function clean(r){ r=(r||"").trim(); if(r.startsWith("error:")) return r.slice(6).trim(); if(r.startsWith("<")||!r) return "Request failed — check with IT."; return r; }

async function postCred(path, body){
  try{ const r=await fetch(api(path),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return (await r.text()); }
  catch(e){ return "error: could not reach the server"; }
}

$("#t_install").onclick=()=>signIn("install");
$("#t_rescue").onclick =()=>signIn("rescue");
$("#t_lang").onclick   =()=>langPick();
$("#t_details").onclick=()=>details();
$("#t_connect").onclick=()=>connect();

loadFacts();
setInterval(()=>{ if(!$("#scrim").classList.contains("on")) loadFacts(); }, 4000);
</script>
</body>
</html>
